name: Core CI

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify